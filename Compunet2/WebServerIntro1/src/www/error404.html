<!DOCTYPE html>
<html>
<head>
    <title>Error 404 - Recurso No Encontrado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        .error-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            color: #e74c3c;
            font-size: 72px;
            margin: 0;
        }
        h2 {
            color: #333;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Recurso No Encontrado</h2>
        <p>El archivo solicitado no existe en el servidor.</p>
        <p>Verifica la URL e intenta nuevamente.</p>
        <hr>
        <p><small>Servidor HTTP Multihilo - Java</small></p>
    </div>
</body>
</html>
